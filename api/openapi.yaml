openapi: 3.1.0
info:
  title: Manufacture gateway API
  version: 0.4.0
  summary: REST and live event stream of the Manufacture core.
  description: |
    The gateway role of `manufacture serve` exposes this API on `MF_LISTEN_ADDR` under `/api/v1`,
    the admin panel under `/`, and probes at `/healthz`, `/readyz`, `/metrics`.

    **Auth.** Every `/api/v1` call needs the admin token (`MF_ADMIN_TOKEN`), sent either as
    `Authorization: Bearer <token>` or as the `mf_session` cookie that `POST /api/v1/session` sets.
    One token, one role (admin) for now. The only exception is `POST /api/v1/attempts/{id}/confirm`,
    which takes a **module token** (`MF_MODULE_TOKEN`, `mft_...`) and rejects the admin token.

    **Operator actions** (cancel, resume, retry, skip, budget and priority changes, dead-letter
    actions) require `{"comment": "..."}` (1-2000 characters), written to the audit log and the
    run timeline; 422 without it. The actor is `X-Admin-Actor` when sent, otherwise `admin`.

    **Errors** are `application/problem+json` (RFC 9457) with a stable `code`; 422 responses
    also carry `errors[]` (`path`, `line`, `message`, ...).

    **Pagination.** List endpoints take `limit` (1-200, default 50) and an opaque `cursor`
    and return `next_cursor` when more items exist.

    **Live data.** `GET /api/v1/stream` is a Server-Sent Events stream (works with `EventSource`
    via the cookie, or with `fetch` and the Bearer header). Each frame has `id` (monotonic,
    resumable via `Last-Event-ID`; absent on `metrics.tick`, which is not stored), `event`
    (one of `StreamEventType`) and `data` (the payload JSON; see the `x-sse-payloads` map of
    `StreamEventType`). A client that resumes from an id that is no longer kept gets
    `event: reset` and must reload snapshots (`/overview`, `/pipelines/{name}/conveyor`).
    Comment lines (`: ping`) are sent every 15 s.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080
security:
  - bearer: []
  - session: []
tags:
  - name: system
    description: Probes, version, session, audit.
  - name: resources
    description: Modules and pipelines (declarative specs with revisions).
  - name: runs
    description: Pipeline runs, steps, attempts and blobs.
  - name: modules
    description: Calls made by modules (confirm) and dead letters of module queues.
  - name: live
    description: Snapshots and the live event stream for dashboards and the 3D conveyor.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: The process is alive., content: { text/plain: { schema: { type: string } } } }
  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe (database and broker reachable)
      security: []
      responses:
        "200": { description: Ready., content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
        "503": { description: Not ready., content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
  /api/v1/system:
    get:
      operationId: getSystem
      tags: [system]
      summary: Version, contract version, runtime driver, roles and limits
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/System" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/session:
    post:
      operationId: createSession
      tags: [system]
      summary: Exchange the admin token for an HttpOnly session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], additionalProperties: false, properties: { token: { type: string } } }
      responses:
        "204":
          description: Cookie set.
          headers: { Set-Cookie: { schema: { type: string }, description: "mf_session=...; HttpOnly; SameSite=Strict; Path=/" } }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSession
      tags: [system]
      summary: Clear the session cookie
      responses:
        "204": { description: Cookie cleared. }
  /api/v1/apply:
    post:
      operationId: applyResources
      tags: [resources]
      summary: Create or update resources (server-side apply)
      description: |
        Accepts the same YAML/JSON documents as `manufacture validate`. All documents are validated
        first; nothing is applied when any has an error. A document identical to the current
        revision is `unchanged` and creates no revision.
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: false } }
        - { name: source, in: query, description: Who applies (audit)., schema: { type: string, enum: [cli, ui, bootstrap, api], default: api } }
      requestBody:
        required: true
        content:
          application/yaml: { schema: { type: string } }
          application/json:
            schema:
              description: "Either {files: [...]} (diagnostics then name the files) or the documents themselves as JSON."
              anyOf:
                - $ref: "#/components/schemas/ApplyFiles"
                - { type: object, description: One resource document as JSON. }
      responses:
        "200": { description: "Applied (or would be, for dry_run).", content: { application/json: { schema: { $ref: "#/components/schemas/ApplyResult" } } } }
        "422": { description: "Validation failed; nothing applied. Problem with code validation_failed and errors[].", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/modules:
    get:
      operationId: listModules
      tags: [resources]
      summary: List modules with live status
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ModuleStatus" } } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/modules/{name}:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    get:
      operationId: getModule
      tags: [resources]
      summary: Module spec, status and replicas
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteModule
      tags: [resources]
      summary: Delete a module (fails while a current pipeline revision uses it)
      responses:
        "204": { description: Deleted; the runtime removes its replicas. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/modules/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    get:
      operationId: listModuleRevisions
      tags: [resources]
      summary: Revision history
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionList" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/modules/{name}/scale:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    post:
      operationId: scaleModule
      tags: [resources]
      summary: Set a fixed replica count (creates a new revision)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [replicas], additionalProperties: false, properties: { replicas: { type: integer, minimum: 0, maximum: 1000 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/modules/{name}/logs:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    get:
      operationId: getModuleLogs
      tags: [resources]
      summary: Recent log lines of the module replicas (from the runtime driver)
      parameters:
        - { name: tail, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 200 } }
      responses:
        "200": { description: "Log lines, oldest first.", content: { text/plain: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /api/v1/modules/{name}/metrics:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    get:
      operationId: getModuleMetrics
      tags: [live]
      summary: Time series of one module (the gateway runs fixed mf_* queries against Prometheus)
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [15m, 1h, 6h, 24h, 7d], default: 1h } }
        - { name: step, in: query, description: "Go duration, 5s..1h; default range/120.", schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleMetrics" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/pipelines:
    get:
      operationId: listPipelines
      tags: [resources]
      summary: List pipelines with run counters
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/PipelineSummary" } } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/pipelines/{name}:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    get:
      operationId: getPipeline
      tags: [resources]
      summary: Current revision of a pipeline
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PipelineDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePipeline
      tags: [resources]
      summary: Delete a pipeline (fails while it has active runs)
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/pipelines/{name}/revisions:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    get:
      operationId: listPipelineRevisions
      tags: [resources]
      summary: Revision history
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionList" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/pipelines/{name}/revisions/{revision}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
      - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getPipelineRevision
      tags: [resources]
      summary: One revision
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PipelineDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/pipelines/{name}/runs:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    post:
      operationId: startRun
      tags: [runs]
      summary: Start a run manually
      description: With a source trigger and no `data`, the core sends `source.trigger` to the source module and returns 202; otherwise it starts a run with `data` and returns 201.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 256 } }
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { data: { type: object }, priority: { $ref: "#/components/schemas/Priority" }, labels: { $ref: "#/components/schemas/Labels" }, dedup_key: { type: string, maxLength: 256 } } } } }
      responses:
        "201": { description: Run created (or the existing run for the same Idempotency-Key)., content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "202": { description: Source module triggered., content: { application/json: { schema: { type: object, required: [trigger_id], properties: { trigger_id: { type: string, format: uuid } } } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/pipelines/{name}/conveyor:
    parameters: [{ $ref: "#/components/parameters/Name" }]
    get:
      operationId: getConveyor
      tags: [live]
      summary: Snapshot for the 3D conveyor (stages, lanes, live metrics, items in flight)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conveyor" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs, newest first
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RunStatus" } }
        - { name: q, in: query, description: "Prefix of the run id, or text in the attention reason.", schema: { type: string, maxLength: 200 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Run" } }, next_cursor: { type: string } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getRun
      tags: [runs]
      summary: Run with its steps and attempts
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a queued, running or parked run
      requestBody: { $ref: "#/components/requestBodies/Operator" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Resume a run in needs_attention by retrying the failed steps of the current visit (same step_key)
      description: Needs `acknowledge_attention` true when a failed step ended with an attention error (409 attention_ack_required otherwise).
      requestBody: { $ref: "#/components/requestBodies/OperatorAck" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/retry:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: retryRun
      tags: [runs]
      summary: Start a new run of the same pipeline revision with the same initial data
      requestBody: { $ref: "#/components/requestBodies/Operator" }
      responses:
        "201": { description: The new run (trigger.kind = retry)., content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/snapshots/{after_stage}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: after_stage, in: path, required: true, description: Stage index (0-based) after which the context was saved., schema: { type: integer, minimum: 0 } }
    get:
      operationId: getRunSnapshot
      tags: [runs]
      summary: Run context saved after a stage (blob references are not resolved)
      parameters:
        - { name: visit, in: query, description: Visit of the stage; the last one by default., schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: The context JSON., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: listRunEvents
      tags: [runs]
      summary: Timeline of the run (oldest first)
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/StoredEvent" } }, next_cursor: { type: string } } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/budget:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      operationId: patchRunBudget
      tags: [runs]
      summary: Change the run budget (typically before resume after budget_exceeded)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [run_usd, comment], properties: { run_usd: { type: number, exclusiveMinimum: 0 }, warn_usd: { type: number, exclusiveMinimum: 0 }, comment: { $ref: "#/components/schemas/Comment" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/runs/{id}/priority:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      operationId: patchRunPriority
      tags: [runs]
      summary: Change the priority of a queued run
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [priority, comment], properties: { priority: { $ref: "#/components/schemas/Priority" }, comment: { $ref: "#/components/schemas/Comment" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: The run is no longer queued., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/steps/{step_key}/retry:
    parameters: [{ $ref: "#/components/parameters/StepKey" }]
    post:
      operationId: retryStep
      tags: [runs]
      summary: New attempt of the same visit (same step_key, so a module ledger deduplicates)
      description: When the last error is of class attention (including outcome_unknown), the request needs `acknowledge_attention` true; otherwise 409 `attention_ack_required` with the error text, which the UI shows for confirmation.
      requestBody: { $ref: "#/components/requestBodies/OperatorAck" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Step" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/steps/{step_key}/skip:
    parameters: [{ $ref: "#/components/parameters/StepKey" }]
    post:
      operationId: skipStep
      tags: [runs]
      summary: Complete the step on behalf of the module (pass a gate or decide by hand)
      description: "`output` is checked against the module output_schema; a waiting module gets step.cancel with reason operator."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [comment], properties: { comment: { $ref: "#/components/schemas/Comment" }, output: { type: object } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Step" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/steps/{step_key}/cancel:
    parameters: [{ $ref: "#/components/parameters/StepKey" }]
    post:
      operationId: cancelStep
      tags: [runs]
      summary: Cancel the step; then the step on_cancel applies (fail or attention, default attention)
      requestBody: { $ref: "#/components/requestBodies/Operator" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Step" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/attempts/{id}/confirm:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: confirmAttempt
      tags: [modules]
      summary: Check, right before an irreversible action, that the attempt is still current
      description: |
        Called by a module (module token) before an irreversible side effect. One transaction checks that
        the attempt is the current attempt of its step, running or waiting, with a live lease, that the run
        is running or waiting_human and that the deadline is more than `extend_seconds` away. On `ok` the lease
        is extended to now + extend_seconds and the attempt becomes **confirmed**: until `confirmed_until`
        it is never marked lost or timed out, and afterwards without a result it goes to needs_attention
        (outcome_unknown) instead of a retry. Repeating confirm is idempotent.
      security: [{ moduleToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmRequest" } } }
      responses:
        "200": { description: One of the four outcomes., content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmResult" } } } }
        "401": { description: Unknown or revoked module token., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { description: "The attempt belongs to another module, or the admin token was used.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { description: step_key does not match the attempt., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/dead-letters:
    get:
      operationId: listDeadLetters
      tags: [modules]
      summary: Dead-lettered broker messages, newest first
      parameters:
        - { name: queue, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeadLetterStatus" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DeadLetter" } }, next_cursor: { type: string } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/dead-letters/redeliver:
    post:
      operationId: redeliverDeadLetters
      tags: [modules]
      summary: Redeliver several dead letters (same message_id, through the outbox)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [ids, comment], properties: { ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer } }, comment: { $ref: "#/components/schemas/Comment" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [redelivered], properties: { redelivered: { type: integer } } } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/dead-letters/{dl_id}:
    parameters: [{ $ref: "#/components/parameters/DeadLetterID" }]
    get:
      operationId: getDeadLetter
      tags: [modules]
      summary: One dead letter with body, headers and x-death
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/dead-letters/{dl_id}/redeliver:
    parameters: [{ $ref: "#/components/parameters/DeadLetterID" }]
    post:
      operationId: redeliverDeadLetter
      tags: [modules]
      summary: Publish the message again to its original exchange and routing key with the same message_id
      requestBody: { $ref: "#/components/requestBodies/Operator" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetter" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/dead-letters/{dl_id}/discard:
    parameters: [{ $ref: "#/components/parameters/DeadLetterID" }]
    post:
      operationId: discardDeadLetter
      tags: [modules]
      summary: Mark a dead letter discarded
      requestBody: { $ref: "#/components/requestBodies/Operator" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetter" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/usage:
    get:
      operationId: getUsage
      tags: [runs]
      summary: Usage totals (cost and tokens as reported by modules), grouped
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: label, in: query, description: "key=value", schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: group_by, in: query, schema: { type: string, enum: [pipeline, day, module, stage], default: pipeline } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items, total], properties: { total: { $ref: "#/components/schemas/Usage" }, items: { type: array, items: { type: object, required: [key, usage], properties: { key: { type: string }, usage: { $ref: "#/components/schemas/Usage" } } } } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/blobs/presign:
    get:
      operationId: presignBlob
      tags: [runs]
      summary: Short-lived download URL for a blob reference of a run
      parameters:
        - { name: ref, in: query, required: true, schema: { type: string, pattern: "^s3://" } }
        - { name: ttl_seconds, in: query, schema: { type: integer, minimum: 30, maximum: 86400, default: 900 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [url, expires_at], properties: { url: { type: string, format: uri }, expires_at: { type: string, format: date-time } } } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      operationId: getOverview
      tags: [live]
      summary: Dashboard snapshot (counters, pipelines, modules with live metrics)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/stream:
    get:
      operationId: streamEvents
      tags: [live]
      summary: Live events (Server-Sent Events)
      parameters:
        - name: topics
          in: query
          description: Comma-separated topics; default all.
          schema: { type: string, example: "runs,steps,modules,metrics,resources" }
        - { name: pipeline, in: query, description: Only events of this pipeline (module and metrics events are not filtered)., schema: { type: string } }
        - { name: Last-Event-ID, in: header, description: Resume after this event id., schema: { type: string } }
        - { name: last_event_id, in: query, description: Same as the header (for clients that cannot set headers)., schema: { type: string } }
      responses:
        "200":
          description: |
            `text/event-stream`. Each frame: `id: <n>` (not on metrics.tick), `event: <StreamEventType>`,
            `data: <payload JSON>`. Topics: runs (run.*), steps (step.*), modules (module.*),
            resources (pipeline.*), metrics (metrics.tick); reset is always sent.
          content: { text/event-stream: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      operationId: listAudit
      tags: [system]
      summary: Operator actions, newest first
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }, next_cursor: { type: string } } } } }
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      tags: [system]
      summary: This document
      security: []
      responses:
        "200": { description: OK, content: { application/yaml: { schema: { type: string } } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "MF_ADMIN_TOKEN" }
    session: { type: apiKey, in: cookie, name: mf_session }
    moduleToken: { type: http, scheme: bearer, description: "MF_MODULE_TOKEN of a module (mft_...), shown once when the module is applied; accepted only by confirm." }
  parameters:
    Name: { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" } }
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    StepKey: { name: step_key, in: path, required: true, description: "One visit of a step (uuid5, see docs/messaging.md).", schema: { type: string, format: uuid } }
    DeadLetterID: { name: dl_id, in: path, required: true, schema: { type: integer } }
  requestBodies:
    Operator:
      required: true
      content: { application/json: { schema: { type: object, additionalProperties: false, required: [comment], properties: { comment: { $ref: "#/components/schemas/Comment" } } } } }
    OperatorAck:
      required: true
      content: { application/json: { schema: { type: object, additionalProperties: false, required: [comment], properties: { comment: { $ref: "#/components/schemas/Comment" }, acknowledge_attention: { type: boolean, default: false } } } } }
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: "Stable machine code: not_found, conflict, invalid_request, unauthorized, validation_failed, not_implemented, unavailable, internal." }
        detail: { type: string }
        instance: { type: string }
        errors: { type: array, description: Present on validation_failed., items: { $ref: "#/components/schemas/Diagnostic" } }
    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        checks: { type: object, additionalProperties: { type: string, description: '"ok" or the error' } }
    System:
      type: object
      required: [version, contract_version, driver, roles, limits]
      properties:
        version: { type: string }
        commit: { type: string }
        contract_version: { type: string }
        driver: { type: string, enum: [docker, kubernetes, external] }
        roles: { type: array, items: { type: string, enum: [engine, controller, gateway] } }
        limits:
          type: object
          required: [max_message_bytes, inline_max_bytes, max_apply_bytes]
          properties:
            max_message_bytes: { type: integer }
            inline_max_bytes: { type: integer }
            max_apply_bytes: { type: integer }
            max_foreach_items: { type: integer }
    Diagnostic:
      type: object
      required: [severity, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        source: { type: string, description: File name or "request". }
        line: { type: integer }
        column: { type: integer }
        resource: { type: string, description: "Kind/name, e.g. Pipeline/hello." }
        path: { type: string, description: "JSON pointer inside the document, e.g. /spec/stages/0/steps/1." }
        message: { type: string }
    ApplyFiles:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items: { type: object, required: [content], properties: { name: { type: string }, content: { type: string, description: YAML or JSON text. } } }
    ApplyResult:
      type: object
      required: [applied, results]
      properties:
        applied: { type: boolean, description: false for dry_run }
        results:
          type: array
          items:
            type: object
            required: [kind, name, action, revision]
            properties:
              kind: { type: string, enum: [Module, Pipeline] }
              name: { type: string }
              action: { type: string, enum: [created, updated, unchanged] }
              revision: { type: integer }
        warnings: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
    Revision:
      type: object
      required: [revision, spec_hash, applied_at, applied_by, source]
      properties:
        revision: { type: integer }
        spec_hash: { type: string }
        applied_at: { type: string, format: date-time }
        applied_by: { type: string }
        source: { type: string, enum: [cli, ui, bootstrap, api] }
        current: { type: boolean }
    RevisionList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Revision" } } }
    Health: { type: string, enum: [up, degraded, down, unknown] }
    LiveMetrics:
      type: object
      description: Rolling 1-minute window computed by the core.
      required: [rate, p50_ms, p95_ms, in_flight, queue_depth, error_rate]
      properties:
        rate: { type: number, description: Finished attempts per second. }
        p50_ms: { type: number }
        p95_ms: { type: number }
        in_flight: { type: integer }
        queue_depth: { type: integer, description: -1 when unknown }
        error_rate: { type: number, minimum: 0, maximum: 1 }
    Condition:
      type: object
      required: [type, status]
      properties:
        type: { type: string, examples: [Available, ImagePulled, ContractCompatible, Progressing] }
        status: { type: string, enum: ["True", "False", "Unknown"] }
        reason: { type: string }
        message: { type: string }
        since: { type: string, format: date-time }
    Replica:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [starting, ready, unhealthy, stopped] }
        sdk_version: { type: string }
        version: { type: string }
        last_seen_at: { type: string, format: date-time }
        in_flight: { type: integer }
    ModuleStatus:
      type: object
      description: Module with live status (list item, module.status SSE payload).
      required: [name, revision, image, runtime, driver, replicas, health, conditions, queue_depth, dlq_depth, in_flight, live]
      properties:
        name: { type: string }
        revision: { type: integer }
        image: { type: string }
        runtime: { type: string, enum: [auto, external] }
        driver: { type: string, enum: [docker, kubernetes, external] }
        replicas: { type: object, required: [desired, ready], properties: { desired: { type: integer }, ready: { type: integer } } }
        health: { $ref: "#/components/schemas/Health" }
        conditions: { type: array, items: { $ref: "#/components/schemas/Condition" } }
        last_heartbeat_at: { type: string, format: date-time }
        queue_depth: { type: integer, description: -1 when unknown }
        dlq_depth: { type: integer, description: Dead letters whose source is this module. }
        in_flight: { type: integer }
        sdk_version: { type: string }
        contract_version: { type: string }
        live: { $ref: "#/components/schemas/LiveMetrics" }
    ModuleDetail:
      allOf:
        - $ref: "#/components/schemas/ModuleStatus"
        - type: object
          required: [spec, yaml, replica_list, updated_at]
          properties:
            spec: { type: object, description: The applied Module document (schemas/v1/module.schema.json). }
            yaml: { type: string, description: The applied document as YAML. }
            replica_list: { type: array, items: { $ref: "#/components/schemas/Replica" } }
            manifest: { type: object, description: Last module.online payload. }
            updated_at: { type: string, format: date-time }
            applied_by: { type: string }
            source: { type: string }
            managed_by: { type: string }
    ModuleMetrics:
      type: object
      required: [range, step, series]
      properties:
        range: { type: string }
        step: { type: string }
        series:
          type: object
          description: Each series is a list of [unix_seconds, value] pairs.
          required: [throughput, latency_p50_ms, latency_p95_ms, errors, in_flight, queue_depth]
          properties:
            throughput: { $ref: "#/components/schemas/Series" }
            latency_p50_ms: { $ref: "#/components/schemas/Series" }
            latency_p95_ms: { $ref: "#/components/schemas/Series" }
            errors: { $ref: "#/components/schemas/Series" }
            in_flight: { $ref: "#/components/schemas/Series" }
            queue_depth: { $ref: "#/components/schemas/Series" }
    Series:
      type: array
      items: { type: array, prefixItems: [{ type: number }, { type: number }], minItems: 2, maxItems: 2 }
    StageView:
      type: object
      description: Compiled stage (step ids filled in) so clients do not re-derive them.
      required: [name, index, kind, lanes]
      properties:
        name: { type: string }
        index: { type: integer }
        kind: { type: string, enum: [single, parallel, foreach] }
        lanes:
          type: array
          items: { type: object, required: [step_id, module], properties: { step_id: { type: string }, module: { type: string } } }
        routes:
          type: array
          items: { type: object, required: [goto], properties: { goto: { type: string }, max_visits: { type: integer } } }
    RunCounters:
      type: object
      required: [active, queued, needs_attention]
      properties:
        active: { type: integer }
        queued: { type: integer }
        needs_attention: { type: integer }
        succeeded_24h: { type: integer }
        failed_24h: { type: integer }
    PipelineSummary:
      type: object
      required: [name, revision, stages, updated_at, runs]
      properties:
        name: { type: string }
        revision: { type: integer }
        stages: { type: array, items: { $ref: "#/components/schemas/StageView" } }
        updated_at: { type: string, format: date-time }
        managed_by: { type: string }
        runs: { $ref: "#/components/schemas/RunCounters" }
    PipelineDetail:
      type: object
      required: [name, revision, yaml, spec, stages, updated_at, applied_by, source]
      properties:
        name: { type: string }
        revision: { type: integer }
        yaml: { type: string }
        spec: { type: object, description: The applied Pipeline document. }
        stages: { type: array, items: { $ref: "#/components/schemas/StageView" } }
        updated_at: { type: string, format: date-time }
        applied_by: { type: string }
        source: { type: string }
        managed_by: { type: string }
    RunStatus:
      type: string
      description: "waiting_human: every unfinished step of the current stage waits for a human (does not hold a max_runs slot unless concurrency.count_waiting)."
      enum: [queued, running, waiting_human, succeeded, failed, needs_attention, cancelled]
    StepStatus: { type: string, enum: [pending, dispatched, running, waiting, succeeded, failed, skipped, cancelled] }
    Comment: { type: string, minLength: 1, maxLength: 2000 }
    Priority: { type: integer, minimum: -100, maximum: 100, default: 0 }
    Labels: { type: object, maxProperties: 32, additionalProperties: { type: string, maxLength: 256 } }
    Usage:
      type: object
      description: Cost and tokens as reported by modules (cumulative per attempt; summed per step and run).
      required: [cost_usd]
      properties:
        cost_usd: { type: number }
        tokens:
          type: object
          additionalProperties:
            type: object
            properties: { input: { type: integer }, output: { type: integer }, cache_read: { type: integer }, cache_write: { type: integer } }
    Attention:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [step_failed, budget_exceeded, budget_insufficient, outcome_unknown, max_visits_exceeded, cancelled_after_confirm, timeout] }
        message: { type: string }
    Waiting:
      type: object
      required: [reason, since]
      properties:
        reason: { type: string, enum: [human, external] }
        message: { type: string }
        expected_by: { type: string, format: date-time }
        since: { type: string, format: date-time }
        deadline: { type: string, format: date-time, description: When wait.timeout expires. }
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [step_key]
      properties:
        step_key: { type: string, format: uuid }
        action: { type: string, maxLength: 128, description: "What the module is about to do (audit), e.g. media_publish." }
        extend_seconds: { type: integer, minimum: 1, maximum: 600, default: 120 }
    ConfirmResult:
      type: object
      required: [result, attempt_id, step_key, visit]
      properties:
        result: { type: string, enum: [ok, superseded, cancelled, deadline] }
        attempt_id: { type: string, format: uuid }
        step_key: { type: string, format: uuid }
        visit: { type: integer }
        lease_until: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        detail: { type: string, description: "superseded: new_attempt | lost | timed_out; cancelled: run | step | budget | run_inactive." }
    DeadLetterStatus: { type: string, enum: [parked, redelivered, discarded] }
    DeadLetter:
      type: object
      required: [id, exchange, routing_key, source_queue, reason, death_count, status, received_at]
      properties:
        id: { type: integer }
        message_id: { type: string, format: uuid }
        type: { type: string }
        exchange: { type: string }
        routing_key: { type: string }
        source_queue: { type: string }
        source_module: { type: string }
        reason: { type: string, description: "x-death reason: rejected, expired, maxlen, delivery_limit." }
        death_count: { type: integer }
        status: { $ref: "#/components/schemas/DeadLetterStatus" }
        first_death_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        acted_at: { type: string, format: date-time }
        acted_by: { type: string }
        comment: { type: string }
    DeadLetterDetail:
      allOf:
        - $ref: "#/components/schemas/DeadLetter"
        - type: object
          required: [headers, body]
          properties:
            headers: { type: object }
            body: { type: string, description: "The message body: JSON as text, or base64 when not UTF-8 (see body_encoding)." }
            body_encoding: { type: string, enum: [utf8, base64] }
    ErrorInfo:
      type: object
      required: [class, code, message]
      properties:
        class: { type: string, enum: [transient, fatal, attention, timeout, lost, cancelled] }
        code: { type: string }
        message: { type: string }
    Run:
      type: object
      required: [id, pipeline, revision, status, stage_index, trigger, created_at]
      properties:
        id: { type: string, format: uuid }
        pipeline: { type: string }
        revision: { type: integer }
        status: { $ref: "#/components/schemas/RunStatus" }
        stage_index: { type: integer, description: Current (or last) stage index. }
        stage: { type: string }
        attention: { type: string, description: Why the run needs an operator (the message of attention_info). }
        attention_info: { $ref: "#/components/schemas/Attention" }
        trigger: { type: object, required: [kind], properties: { kind: { type: string, enum: [manual, source, schedule, api, retry] }, by: { type: string } } }
        priority: { $ref: "#/components/schemas/Priority" }
        labels: { $ref: "#/components/schemas/Labels" }
        dedup_key: { type: string }
        queue_reason: { type: string, enum: [max_runs, min_interval, day_budget], description: Why a queued run is not admitted yet. }
        budget:
          type: object
          properties:
            run_usd: { type: number }
            warn_usd: { type: number }
            state: { type: string, enum: [ok, warn, exceeded] }
        spent_usd: { type: number }
        usage: { $ref: "#/components/schemas/Usage" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { $ref: "#/components/schemas/ErrorInfo" }
    Attempt:
      type: object
      required: [attempt_id, number, status]
      properties:
        attempt_id: { type: string, format: uuid, description: "Same as attempt.id in the envelope (v2 has no fence; the id is unique per attempt)." }
        number: { type: integer, description: 1-based. }
        status: { type: string, enum: [scheduled, dispatched, running, waiting, succeeded, failed, timed_out, lost, cancelled] }
        replica_id: { type: string }
        dispatched_at: { type: string, format: date-time }
        lease_until: { type: string, format: date-time }
        deadline: { type: string, format: date-time, description: "started_at + timeout + time spent waiting (and at most the absolute deadline)." }
        confirmed_at: { type: string, format: date-time }
        confirmed_until: { type: string, format: date-time }
        usage: { $ref: "#/components/schemas/Usage" }
        progress: { type: number, minimum: 0, maximum: 1 }
        not_before: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { $ref: "#/components/schemas/ErrorInfo" }
    Step:
      type: object
      description: One visit of a step (a stage visited again after a route back has a new row with visit + 1).
      required: [stage, stage_index, step_id, module, status, visits, attempts]
      properties:
        step_key: { type: string, format: uuid }
        stage: { type: string }
        stage_index: { type: integer }
        step_id: { type: string }
        module: { type: string }
        item_index: { type: integer, description: foreach only. }
        status: { $ref: "#/components/schemas/StepStatus" }
        visit: { type: integer, description: "Visit of the stage this row belongs to: 1 for the first pass, higher after route loops." }
        visits: { type: integer, description: "Same as visit (kept for API 0.3 clients; to be removed in 0.5)." }
        waiting: { $ref: "#/components/schemas/Waiting" }
        wait_total_seconds: { type: number }
        usage: { $ref: "#/components/schemas/Usage" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        output: { type: object }
        attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
    RunDetail:
      type: object
      required: [run, steps, context, snapshots]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        context: { type: object, description: Current run data (blob references are not resolved). }
        snapshots:
          type: array
          items:
            type: object
            required: [after_stage, sha256, created_at, size]
            properties:
              after_stage: { type: integer }
              visit: { type: integer }
              sha256: { type: string }
              created_at: { type: string, format: date-time }
              size: { type: integer }
    Conveyor:
      type: object
      required: [pipeline, revision, stages, items]
      properties:
        pipeline: { type: string }
        revision: { type: integer }
        stages:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/StageView"
              - type: object
                required: [live]
                properties:
                  live:
                    type: object
                    description: Per lane (by step_id).
                    additionalProperties:
                      type: object
                      required: [health, replicas, metrics]
                      properties:
                        health: { $ref: "#/components/schemas/Health" }
                        replicas: { type: object, required: [desired, ready], properties: { desired: { type: integer }, ready: { type: integer } } }
                        metrics: { $ref: "#/components/schemas/LiveMetrics" }
        items:
          type: array
          description: Runs in flight (at most 2000; the rest are counted in overflow).
          items:
            type: object
            required: [run_id, stage_index, state]
            properties:
              run_id: { type: string, format: uuid }
              stage_index: { type: integer }
              step_ids: { type: array, items: { type: string }, description: Steps being processed. }
              state: { type: string, enum: [queued, moving, processing, failed, attention] }
              since: { type: string, format: date-time }
        overflow: { type: integer }
        last_event_id: { type: string }
    Overview:
      type: object
      required: [pipelines, modules, runs, last_event_id]
      properties:
        pipelines: { type: array, items: { $ref: "#/components/schemas/PipelineSummary" } }
        modules: { type: array, items: { $ref: "#/components/schemas/ModuleStatus" } }
        runs: { $ref: "#/components/schemas/RunCounters" }
        last_event_id: { type: string, description: Pass as Last-Event-ID to /stream to continue from this snapshot. }
    AuditEntry:
      type: object
      required: [id, at, actor, action, target]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string, examples: [apply, scale, delete, run.start, run.cancel, run.resume, run.retry, step.retry, step.skip, step.cancel, run.budget, run.priority, dead_letter.redeliver, attempt.confirm, session.create] }
        target: { type: string }
        comment: { type: string }
        details: { type: object }
    StreamEventType:
      type: string
      enum:
        - run.created
        - run.updated
        - run.finished
        - step.dispatched
        - step.started
        - step.progress
        - step.succeeded
        - step.failed
        - step.skipped
        - module.status
        - module.deleted
        - pipeline.applied
        - pipeline.deleted
        - metrics.tick
        - reset
      description: "Planned for API 0.5 (once the panel handles them): step.waiting (StepEvent with waiting) and run.budget_warning (RunEvent). Until then a waiting step is reported by step.progress with status waiting in GET /runs/{id}."
      x-sse-payloads:
        run.*: RunEvent
        step.*: StepEvent
        module.status: ModuleStatus
        module.deleted: NameEvent
        pipeline.applied: PipelineEvent
        pipeline.deleted: NameEvent
        metrics.tick: MetricsTick
        reset: "{}"
    RunEvent:
      type: object
      required: [run_id, pipeline, revision, status, at]
      properties:
        run_id: { type: string, format: uuid }
        pipeline: { type: string }
        revision: { type: integer }
        status: { $ref: "#/components/schemas/RunStatus" }
        stage_index: { type: integer }
        stage: { type: string }
        error: { $ref: "#/components/schemas/ErrorInfo" }
        attention: { $ref: "#/components/schemas/Attention" }
        priority: { type: integer }
        spent_usd: { type: number }
        at: { type: string, format: date-time }
    StepEvent:
      type: object
      required: [run_id, pipeline, stage, stage_index, step_id, module, at]
      properties:
        run_id: { type: string, format: uuid }
        pipeline: { type: string }
        stage: { type: string }
        stage_index: { type: integer }
        step_id: { type: string }
        module: { type: string }
        item_index: { type: integer }
        attempt: { type: integer, description: Attempt number. }
        attempt_id: { type: string, format: uuid }
        step_key: { type: string, format: uuid }
        visit: { type: integer }
        progress: { type: number, minimum: 0, maximum: 1 }
        message: { type: string, description: step.progress and step.waiting. }
        waiting: { $ref: "#/components/schemas/Waiting" }
        error: { $ref: "#/components/schemas/ErrorInfo" }
        at: { type: string, format: date-time }
    NameEvent:
      type: object
      required: [name]
      properties: { name: { type: string } }
    PipelineEvent:
      type: object
      required: [name, revision]
      properties: { name: { type: string }, revision: { type: integer } }
    MetricsTick:
      type: object
      required: [ts, modules]
      properties:
        ts: { type: integer, description: Unix milliseconds. }
        modules: { type: object, additionalProperties: { $ref: "#/components/schemas/LiveMetrics" } }
        runs: { type: object, properties: { active: { type: integer }, queued: { type: integer } } }
    StoredEvent:
      type: object
      description: One entry of a run timeline (same id space as the SSE stream).
      required: [id, type, at, data]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/StreamEventType" }
        at: { type: string, format: date-time }
        data:
          description: The SSE payload of that event (by type, see StreamEventType x-sse-payloads).
          anyOf:
            - $ref: "#/components/schemas/RunEvent"
            - $ref: "#/components/schemas/StepEvent"
            - $ref: "#/components/schemas/ModuleStatus"
            - $ref: "#/components/schemas/NameEvent"
            - $ref: "#/components/schemas/PipelineEvent"
            - $ref: "#/components/schemas/MetricsTick"
