name: contract-release

on:
  push:
    tags: ["contract-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check tag matches schemas/VERSION
        run: test "contract-v$(cat schemas/VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: contract tests
        run: go test ./schemas/... ./internal/contract/... ./internal/spec/...
      - name: build archive
        run: |
          name="${GITHUB_REF_NAME}"
          mkdir -p "dist/${name}"
          cp -r schemas api/openapi.yaml docs/messaging.md CHANGELOG.md "dist/${name}/"
          mkdir -p "dist/${name}/testdata" && cp -r testdata/valid testdata/invalid testdata/envelope "dist/${name}/testdata/"
          find "dist/${name}" -name '*.go' -delete
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS)
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --title "Contract ${GITHUB_REF_NAME#contract-v}" --notes "Manufacture contract: resource schemas, envelope schemas, gateway OpenAPI, testdata. See CHANGELOG.md."
