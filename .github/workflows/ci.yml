name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lint api/openapi.yaml
        run: npx --yes @redocly/cli@2 lint api/openapi.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -n 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: make build
      - name: smoke
        run: |
          bin/manufacture version
          make validate-testdata
      - uses: actions/upload-artifact@v7
        with:
          name: manufacture-linux-amd64
          path: bin/manufacture
          retention-days: 7
