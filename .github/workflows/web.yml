name: web

on:
  pull_request:
    paths:
      - "web/**"
      - "api/openapi.yaml"
      - "schemas/**"
      - "testdata/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/openapi.yaml"
      - "schemas/**"
      - "testdata/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v7
        if: matrix.node == 24
        with:
          go-version-file: go.mod
      - name: embed the built UI
        if: matrix.node == 24
        run: go test -count=1 ./ && go build ./
        # `./` is web/ (package web); the built dist/ is embedded and served by web.Handler().

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:mock
      - name: smoke (mock simulator, headless Chromium + SwiftShader)
        run: npx playwright test --project=smoke
      - name: screenshots
        run: npx playwright test --project=shots
        env:
          MF_SHOTS_DIR: test-results/shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-e2e
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
