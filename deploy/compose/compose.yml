# Local Manufacture stack: PostgreSQL, RabbitMQ and the core; object storage is an existing MinIO (see .env.example). Modules run elsewhere (runtime: external)
# and connect to RabbitMQ on 127.0.0.1:5672; see manufacture-modules compose for the iTim modules.
name: manufacture
services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: mf, POSTGRES_PASSWORD: mf, POSTGRES_DB: mf}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mf"], interval: 3s, retries: 20}
  rabbitmq:
    image: rabbitmq:4-management
    environment: {RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 86400000"}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, retries: 30}
  core:
    build: {context: ../.., dockerfile: Dockerfile}
    image: manufacture-core:local
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    environment:
      MF_LISTEN_ADDR: "0.0.0.0:8080"
      MF_DATABASE_URL: postgres://mf:mf@postgres:5432/mf?sslmode=disable
      MF_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      MF_S3_ENDPOINT: "${S3_ENDPOINT:?set S3_ENDPOINT in .env (existing MinIO host[:port])}"
      MF_S3_ACCESS_KEY: "${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}"
      MF_S3_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
      MF_S3_TLS: "${S3_TLS:-true}"
      MF_S3_BUCKET: "${S3_BUCKET:-mf-blobs}"
      MF_ADMIN_TOKEN: "${MF_ADMIN_TOKEN:-mf_local_dev_admin_token_0123456789abcdef}"
      MF_RUNTIME: external
      MF_LOG_FORMAT: text
    ports: ["127.0.0.1:8080:8080"]
volumes: {pg: {}}
